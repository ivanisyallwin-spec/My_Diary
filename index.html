<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d7a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Diary">
<meta name="mobile-web-app-capable" content="yes">
<title>My Diary 🌿</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"My Diary","short_name":"Diary","start_url":".","display":"standalone","background_color":"%23e8f5ea","theme_color":"%232d7a3e","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"%3E%3Crect width=\"100\" height=\"100\" fill=\"%23e8f5ea\"/%3E%3Ctext y=\".9em\" font-size=\"90\"%3E🌿%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  :root {
    /* HEAVENS — default (rich lush green) */
    --bg: linear-gradient(180deg, #e8f5ea 0%, #f4faf1 50%, #d9eedd 100%);
    --primary: #2d7a3e;
    --primary-dark: #1e5a2a;
    --accent: #b5dcc0;
    --card: #ffffff;
    --text: #1e3826;
    --soft: #eaf5ec;
    --border: #a3cfae;
  }
  body.theme-sakura {
    --bg: linear-gradient(180deg, #ffe4ec 0%, #fff5f8 50%, #ffe9f1 100%);
    --primary: #ff8fb1; --primary-dark: #e6739a; --accent: #ffd6e3;
    --text: #5a3a4a; --soft: #fff0f5; --border: #ffcad9;
  }
  body.theme-matcha {
    --bg: linear-gradient(180deg, #e8f3e0 0%, #f4faef 50%, #e3f0d8 100%);
    --primary: #8bbf6a; --primary-dark: #6fa450; --accent: #d4e8c0;
    --text: #3d4a32; --soft: #f0f7e8; --border: #c8dfb2;
  }
  body.theme-blueberry {
    --bg: linear-gradient(180deg, #e0e7ff 0%, #f0f3ff 50%, #dde4ff 100%);
    --primary: #7c8cf0; --primary-dark: #5d6fd8; --accent: #c5d0ff;
    --text: #2e3a6b; --soft: #eef1ff; --border: #b8c4f5;
  }
  body.theme-honey {
    --bg: linear-gradient(180deg, #fff3d6 0%, #fffaeb 50%, #ffeec2 100%);
    --primary: #f0b840; --primary-dark: #d49a20; --accent: #ffe39a;
    --text: #6b4d12; --soft: #fff7e0; --border: #f5d68a;
  }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg);
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--text);
    padding-bottom: 90px;
    transition: background 0.5s ease;
    padding-top: env(safe-area-inset-top);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
  input, textarea { font-family: inherit; }
  @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .pop { animation: pop 0.3s ease; }
  .float-emoji { animation: float 3s ease-in-out infinite; display: inline-block; }
  .cute-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04); }

  header { padding: 20px 20px 12px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-family: 'Caveat', cursive; font-size: 38px; color: var(--primary-dark); line-height: 1; }
  .sub { font-size: 14px; opacity: 0.75; margin-top: 4px; font-weight: 500; }
  .palette-btn { background: var(--card); border: 2px solid var(--border); border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 22px; }

  .content { padding: 0 16px; }
  .calendar-card { background: var(--card); border-radius: 24px; padding: 18px; border: 2px solid var(--border); }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .cal-title { font-size: 22px; font-weight: 700; color: var(--primary-dark); letter-spacing: 0.3px; }
  .week-info { font-size: 13px; color: var(--primary); margin-top: 4px; font-weight: 700; }
  .cal-nav { background: var(--soft); border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--primary); font-weight: 700; }

  /* Calendar grid with week column — PAPER-PLANNER STYLE */
  .day-headers, .day-grid { display: grid; grid-template-columns: 30px repeat(7, 1fr); gap: 4px; }
  .day-headers { margin-bottom: 8px; }
  .day-header { text-align: center; font-size: 13px; font-weight: 700; opacity: 0.8; padding: 6px 0; letter-spacing: 0.5px; }
  .day-header.sun { color: var(--primary); }
  .day-header.wk { color: var(--primary-dark); opacity: 1; font-size: 11px; }
  .week-cell { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--primary-dark); background: var(--soft); border-radius: 8px; opacity: 0.9; letter-spacing: 0.3px; min-height: 78px; }
  .day-cell {
    min-height: 78px; border: 1.5px solid var(--border); background: #fff;
    border-radius: 10px; color: var(--text); font-weight: 600;
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
    position: relative; padding: 4px 3px 3px 5px; transition: all 0.2s;
    overflow: hidden; text-align: left;
  }
  .day-cell .d-num { font-size: 14px; font-weight: 800; color: var(--primary-dark); line-height: 1; align-self: flex-start; }
  .day-cell.today { background: var(--accent); border-color: var(--primary); }
  .day-cell.today .d-num { color: var(--primary-dark); }
  .day-cell.selected { border-color: var(--primary); border-width: 2.5px; }
  .day-cell .ev-list { margin-top: 3px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .day-cell .ev-item {
    font-size: 9.5px; line-height: 1.15; font-weight: 600;
    background: var(--soft); color: var(--primary-dark);
    padding: 2px 3px; border-radius: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-left: 2px solid var(--primary);
  }
  .day-cell .ev-more { font-size: 9px; opacity: 0.7; font-weight: 700; padding-left: 2px; }
  .day-cell .entry-dot { position: absolute; bottom: 3px; right: 4px; font-size: 10px; }

  .section-head { display: flex; justify-content: space-between; align-items: center; margin: 22px 4px 12px; }
  .section-title { font-size: 17px; color: var(--primary-dark); font-weight: 700; }
  .section-sub { font-size: 13px; opacity: 0.75; margin-top: 3px; font-weight: 600; color: var(--primary); }
  .btn-primary { background: var(--primary); color: white; padding: 10px 16px; border-radius: 22px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  .empty { background: var(--card); border-radius: 16px; padding: 24px; text-align: center; border: 2px dashed var(--border); font-size: 14px; opacity: 0.65; }
  .event-card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--border); }
  .event-title { font-weight: 700; font-size: 15px; }
  .event-meta { font-size: 13px; opacity: 0.75; margin-top: 3px; font-weight: 600; }
  .icon-btn { color: var(--primary); padding: 6px; font-size: 17px; }

  nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 2px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 calc(14px + env(safe-area-inset-bottom)); }
  .nav-btn { padding: 4px 16px; display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0.5; font-size: 12px; font-weight: 700; }
  .nav-btn.active { opacity: 1; color: var(--primary); }
  .nav-icon { font-size: 24px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: flex-end; z-index: 100; }
  .modal { background: var(--card); width: 100%; border-radius: 24px 24px 0 0; padding: 24px 20px calc(32px + env(safe-area-inset-bottom)); }
  .handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { color: var(--primary-dark); font-size: 19px; margin-bottom: 16px; font-weight: 700; }
  .input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--border); background: var(--soft); font-size: 16px; outline: none; color: var(--text); margin-bottom: 12px; }
  .reminder-box { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 12px; border-radius: 12px; background: var(--soft); cursor: pointer; font-size: 15px; }
  .modal-actions { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 15px; }
  .btn-cancel { border: 2px solid var(--border); color: var(--text); font-weight: 600; }
  .btn-save { background: var(--primary); color: white; }

  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .theme-card { border: 2px solid var(--border); border-radius: 16px; padding: 16px; text-align: left; }
  .theme-card.active { border-width: 3px; }
  .theme-card .te { font-size: 26px; }
  .theme-card .tn { font-weight: 700; margin-top: 4px; font-size: 15px; }
  .theme-card .td { font-size: 11px; opacity: 0.7; margin-top: 2px; font-weight: 500; }

  .mood-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .mood-btn { background: var(--soft); border: 2px solid transparent; border-radius: 12px; padding: 8px; font-size: 24px; width: 46px; height: 46px; }
  .mood-btn.active { background: var(--accent); border-color: var(--primary); }
  .diary-text { width: 100%; padding: 14px; border-radius: 14px; border: 2px solid var(--border); background: var(--soft); font-size: 20px; outline: none; font-family: 'Caveat', cursive; color: var(--text); resize: vertical; line-height: 1.5; min-height: 150px; }
  .stickers-display { margin-top: 10px; font-size: 26px; }
  .stickers-display span { margin-right: 4px; cursor: pointer; }
  .editor-actions { display: flex; gap: 8px; margin-top: 12px; }
  .sticker-btn { flex: 1; padding: 13px; border-radius: 12px; border: 2px solid var(--border); background: var(--soft); color: var(--primary-dark); font-weight: 700; font-size: 15px; }
  .save-btn { flex: 1; padding: 13px; border-radius: 12px; background: var(--primary); color: white; font-weight: 700; font-size: 15px; }
  .sticker-tray { margin-top: 12px; padding: 12px; background: var(--soft); border-radius: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
  .sticker-pick { background: var(--card); border: 1px solid var(--border); border-radius: 10px; font-size: 24px; width: 42px; height: 42px; }
  .date-pick { background: transparent; color: var(--primary-dark); font-weight: 700; font-size: 17px; outline: none; border: none; margin-bottom: 4px; }
  .selected-week { font-size: 13px; color: var(--primary); font-weight: 700; margin-bottom: 14px; }
  .weather-card { background: var(--card); border: 2px solid var(--border); border-radius: 18px; padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .wx-left { display: flex; align-items: center; gap: 10px; }
  .wx-icon { font-size: 32px; line-height: 1; }
  .wx-temp { font-size: 24px; font-weight: 800; color: var(--primary-dark); line-height: 1; }
  .wx-info { display: flex; flex-direction: column; }
  .wx-cond { font-size: 13px; font-weight: 700; color: var(--primary-dark); }
  .wx-sub { font-size: 11px; opacity: 0.7; font-weight: 600; margin-top: 2px; }
  .wx-right { text-align: right; }
  .wx-loc { font-size: 11px; font-weight: 700; color: var(--primary); opacity: 0.9; }
  .wx-time { font-size: 10px; opacity: 0.55; font-weight: 600; margin-top: 2px; }
  .wx-loading { opacity: 0.6; font-size: 13px; text-align: center; padding: 4px; font-weight: 600; }
  .past-entry { background: var(--card); border-radius: 14px; padding: 13px 15px; margin-bottom: 9px; border: 2px solid var(--border); cursor: pointer; }
  .pe-head { display: flex; justify-content: space-between; align-items: center; }
  .pe-date { font-size: 13px; color: var(--primary-dark); font-weight: 700; }
  .pe-week { font-size: 11px; color: var(--primary); font-weight: 700; margin-left: 6px; background: var(--soft); padding: 2px 7px; border-radius: 8px; }
  .pe-body { margin-top: 7px; font-size: 15px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1><span class="float-emoji" id="emoji">🌿</span> My Diary</h1>
      <div class="sub" id="subtitle">Plan your days</div>
    </div>
    <button class="palette-btn" onclick="openThemes()">🎨</button>
  </header>

  <div id="app" class="content"></div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-cal" onclick="setTab('calendar')">
      <div class="nav-icon">📅</div><span>Calendar</span>
    </button>
    <button class="nav-btn" id="nav-diary" onclick="setTab('diary')">
      <div class="nav-icon">📖</div><span>Diary</span>
    </button>
  </nav>

<script>
// ─────────── ISO Week calculation ───────────
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
function getISOWeekYear(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  return d.getUTCFullYear();
}

// ─────────── Weather (Open-Meteo, no API key) ───────────
const WX_CACHE_MINUTES = 20;
const WX_CODES = {
  0:['☀️','Clear'], 1:['🌤️','Mostly clear'], 2:['⛅','Partly cloudy'], 3:['☁️','Overcast'],
  45:['🌫️','Fog'], 48:['🌫️','Rime fog'],
  51:['🌦️','Light drizzle'], 53:['🌦️','Drizzle'], 55:['🌦️','Heavy drizzle'],
  61:['🌧️','Light rain'], 63:['🌧️','Rain'], 65:['🌧️','Heavy rain'],
  66:['🌧️','Freezing rain'], 67:['🌧️','Freezing rain'],
  71:['🌨️','Light snow'], 73:['🌨️','Snow'], 75:['🌨️','Heavy snow'], 77:['🌨️','Snow grains'],
  80:['🌦️','Showers'], 81:['🌦️','Showers'], 82:['⛈️','Heavy showers'],
  85:['🌨️','Snow showers'], 86:['🌨️','Snow showers'],
  95:['⛈️','Thunderstorm'], 96:['⛈️','Thunder + hail'], 99:['⛈️','Heavy thunder'],
};
function wxFromCode(c){ return WX_CODES[c] || ['🌡️','—']; }

async function loadWeather(){
  const el = document.getElementById('weather');
  if (!el) return;
  // Try cache first
  try {
    const cached = JSON.parse(localStorage.getItem('wx') || 'null');
    if (cached && Date.now() - cached.ts < WX_CACHE_MINUTES*60*1000) {
      renderWeather(cached.data); return;
    }
  } catch(e){}
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=10.8231&longitude=106.6297&current=temperature_2m,relative_humidity_2m,weather_code,apparent_temperature&timezone=Asia%2FBangkok');
    const d = await r.json();
    const data = {
      t: Math.round(d.current.temperature_2m),
      feels: Math.round(d.current.apparent_temperature),
      h: d.current.relative_humidity_2m,
      c: d.current.weather_code,
      ts_api: d.current.time,
    };
    localStorage.setItem('wx', JSON.stringify({ts: Date.now(), data}));
    renderWeather(data);
  } catch(e) {
    el.innerHTML = '<div class="wx-loading">Weather unavailable</div>';
  }
}
function renderWeather(w){
  const el = document.getElementById('weather'); if (!el) return;
  const [icon, cond] = wxFromCode(w.c);
  const now = new Date(w.ts_api || Date.now());
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  el.innerHTML = `
    <div class="wx-left">
      <div class="wx-icon">${icon}</div>
      <div class="wx-info">
        <div><span class="wx-temp">${w.t}°</span> <span class="wx-cond">${cond}</span></div>
        <div class="wx-sub">Feels ${w.feels}° · Humidity ${w.h}%</div>
      </div>
    </div>
    <div class="wx-right">
      <div class="wx-loc">📍 HCMC</div>
      <div class="wx-time">Updated ${hh}:${mm}</div>
    </div>
  `;
}

// ─────────── State ───────────
const THEMES = {
  heavens:   { name: "Heavens",   emoji: "🌿", class: "",               desc: "Lush green · default" },
  sakura:    { name: "Sakura",    emoji: "🌸", class: "theme-sakura",   desc: "Soft pink" },
  matcha:    { name: "Matcha",    emoji: "🍵", class: "theme-matcha",   desc: "Light green" },
  blueberry: { name: "Blueberry", emoji: "🫐", class: "theme-blueberry",desc: "Calm blue" },
  honey:     { name: "Honey",     emoji: "🍯", class: "theme-honey",    desc: "Warm yellow" },
};
const MOODS = [
  { e: "🥰", l: "Loved" }, { e: "😊", l: "Happy" }, { e: "😌", l: "Calm" }, { e: "😐", l: "Meh" },
  { e: "😔", l: "Sad" }, { e: "😤", l: "Frustrated" }, { e: "😴", l: "Tired" }, { e: "🤩", l: "Excited" },
];
const STICKERS = ["🌿","🌸","🌷","🌻","🌈","⭐","✨","💖","🎀","🍰","🧸","☁️","🌙","☀️","🦄","🐰","🍓","🧁","🦋","🍃"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["M","T","W","T","F","S","S"];

let state = {
  theme: localStorage.getItem("theme") || "heavens",
  tab: "calendar",
  viewDate: new Date(),
  selectedDate: todayKey(),
  events: JSON.parse(localStorage.getItem("events") || "{}"),
  entries: JSON.parse(localStorage.getItem("entries") || "{}"),
  showStickers: false,
};

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function parseKey(key) {
  const [y,m,d] = key.split("-").map(Number);
  return new Date(y, m-1, d);
}

function save() {
  localStorage.setItem("theme", state.theme);
  localStorage.setItem("events", JSON.stringify(state.events));
  localStorage.setItem("entries", JSON.stringify(state.entries));
}

function applyTheme() {
  document.body.className = THEMES[state.theme].class;
  document.getElementById("emoji").textContent = THEMES[state.theme].emoji;
  document.querySelector('meta[name="theme-color"]').setAttribute("content",
    getComputedStyle(document.body).getPropertyValue("--primary").trim() || "#2d7a3e");
}

function setTab(t) {
  state.tab = t;
  document.getElementById("nav-cal").classList.toggle("active", t === "calendar");
  document.getElementById("nav-diary").classList.toggle("active", t === "diary");
  document.getElementById("subtitle").textContent = t === "calendar" ? "Plan your days" : "Write your story";
  render();
}

function setTheme(t) {
  state.theme = t;
  save();
  applyTheme();
  closeModal();
  render();
}

function changeMonth(d) {
  const v = new Date(state.viewDate);
  v.setMonth(v.getMonth() + d);
  state.viewDate = v;
  render();
}

function selectDate(key) {
  state.selectedDate = key;
  render();
}

function dateKeyForDay(day) {
  const y = state.viewDate.getFullYear();
  const m = String(state.viewDate.getMonth() + 1).padStart(2, "0");
  return `${y}-${m}-${String(day).padStart(2, "0")}`;
}

function escapeHtml(s) {
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ─────────── Render ───────────
function render() {
  const app = document.getElementById("app");
  if (state.tab === "calendar") { app.innerHTML = renderCalendar(); loadWeather(); }
  else app.innerHTML = renderDiary();
}

function renderCalendar() {
  const year = state.viewDate.getFullYear();
  const month = state.viewDate.getMonth();
  // Monday-first: getDay()=Sun=0..Sat=6  →  Mon=0..Sun=6
  const jsFirstDay = new Date(year, month, 1).getDay();
  const firstDay = (jsFirstDay + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const rows = [];
  let currentRow = new Array(7).fill(null);
  for (let i = 0; i < firstDay; i++) currentRow[i] = null;
  let col = firstDay;
  for (let d = 1; d <= daysInMonth; d++) {
    currentRow[col] = d;
    col++;
    if (col === 7) {
      rows.push(currentRow);
      currentRow = new Array(7).fill(null);
      col = 0;
    }
  }
  if (col !== 0) rows.push(currentRow);

  let cells = "";
  rows.forEach(row => {
    let weekNum = "";
    const thursday = row[3];
    if (thursday !== null) {
      weekNum = getISOWeek(new Date(year, month, thursday));
    } else {
      const firstValid = row.find(d => d !== null);
      if (firstValid) {
        const dt = new Date(year, month, firstValid);
        const dayNum = dt.getDay() || 7;
        const thu = new Date(dt);
        thu.setDate(dt.getDate() + (4 - dayNum));
        weekNum = getISOWeek(thu);
      }
    }
    cells += `<div class="week-cell">W${String(weekNum).padStart(2,"0")}</div>`;
    row.forEach(d => {
      if (d === null) {
        cells += `<div></div>`;
      } else {
        const key = dateKeyForDay(d);
        const isToday = key === todayKey();
        const isSel = key === state.selectedDate;
        const dayEvents = state.events[key] || [];
        const hasEntry = !!state.entries[key];
        // Show up to 2 event titles inside the cell, "+N" for the rest
        const shownEvents = dayEvents.slice(0, 2).map(ev =>
          `<div class="ev-item" title="${escapeHtml(ev.title)}">${ev.time ? escapeHtml(ev.time)+' ' : ''}${escapeHtml(ev.title)}</div>`
        ).join('');
        const moreCount = dayEvents.length - 2;
        const moreHtml = moreCount > 0 ? `<div class="ev-more">+${moreCount} more</div>` : '';
        const entryDot = hasEntry ? `<span class="entry-dot">📝</span>` : '';
        cells += `<button class="day-cell ${isToday?'today':''} ${isSel?'selected':''}" onclick="selectDate('${key}')">
          <span class="d-num">${d}</span>
          <div class="ev-list">${shownEvents}${moreHtml}</div>
          ${entryDot}
        </button>`;
      }
    });
  });

  const today = new Date();
  const thisWeek = getISOWeek(today);
  const thisWeekYear = getISOWeekYear(today);

  const todays = state.events[state.selectedDate] || [];
  let eventsHtml = todays.length === 0
    ? `<div class="empty">Nothing planned — add an event ${THEMES[state.theme].emoji}</div>`
    : todays.map(ev => `<div class="event-card pop">
        <div>
          <div class="event-title">${escapeHtml(ev.title)}</div>
          ${ev.time?`<div class="event-meta">🕐 ${escapeHtml(ev.time)} ${ev.reminder?'🔔':''}</div>`:''}
        </div>
        <button class="icon-btn" onclick="deleteEvent('${ev.id}')">🗑️</button>
      </div>`).join("");

  const selDate = parseKey(state.selectedDate);
  const selWeek = getISOWeek(selDate);
  const selWeekYear = getISOWeekYear(selDate);
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const selDayName = state.selectedDate === todayKey() ? 'Today' : DAY_NAMES[selDate.getDay()];

  return `
    <div class="weather-card cute-shadow" id="weather"><div class="wx-loading">🌤️ Loading weather…</div></div>
    <div class="calendar-card cute-shadow">
      <div class="cal-header">
        <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
        <div style="text-align:center">
          <div class="cal-title">${MONTHS[month]} ${year}</div>
          <div class="week-info">📌 This week: W${String(thisWeek).padStart(2,"0")} · ${thisWeekYear}</div>
        </div>
        <button class="cal-nav" onclick="changeMonth(1)">›</button>
      </div>
      <div class="day-headers">
        <div class="day-header wk">Wk</div>
        ${DAYS.map((d,i)=>`<div class="day-header ${i===5||i===6?'sun':''}">${d}</div>`).join("")}
      </div>
      <div class="day-grid">${cells}</div>
    </div>
    <div class="section-head">
      <div>
        <div class="section-title">${selDayName} · ${state.selectedDate}</div>
        <div class="section-sub">Week ${String(selWeek).padStart(2,"0")} · ${selWeekYear}</div>
      </div>
      <button class="btn-primary" onclick="openEventModal()">+ Event</button>
    </div>
    ${eventsHtml}
  `;
}

function renderDiary() {
  const e = state.entries[state.selectedDate] || { mood: "", text: "", stickers: [] };
  const moodHtml = MOODS.map(m => `<button class="mood-btn ${e.mood===m.e?'active':''}" onclick="setMood('${m.e}')">${m.e}</button>`).join("");
  const stickersDisplay = (e.stickers||[]).map((s,i)=>`<span onclick="removeSticker(${i})">${s}</span>`).join("");
  const stickerTray = state.showStickers
    ? `<div class="sticker-tray">${STICKERS.map(s=>`<button class="sticker-pick" onclick="addSticker('${s}')">${s}</button>`).join("")}</div>` : "";

  const selDate = parseKey(state.selectedDate);
  const selWeek = getISOWeek(selDate);
  const selWeekYear = getISOWeekYear(selDate);

  const past = Object.entries(state.entries).sort((a,b)=>b[0].localeCompare(a[0]));
  const pastHtml = past.length === 0
    ? `<div class="empty">Your story starts here ${THEMES[state.theme].emoji}</div>`
    : past.map(([key, en]) => {
        const d = parseKey(key);
        const w = getISOWeek(d);
        return `<div class="past-entry" onclick="selectDate('${key}')">
          <div class="pe-head">
            <div><span class="pe-date">${key}</span><span class="pe-week">W${String(w).padStart(2,"0")}</span></div>
            <button class="icon-btn" onclick="event.stopPropagation();deleteEntry('${key}')">🗑️</button>
          </div>
          <div class="pe-body">
            ${en.mood?`<span style="margin-right:6px;font-size:18px">${en.mood}</span>`:''}
            <span style="opacity:0.8">${escapeHtml((en.text||'').slice(0,60))}${(en.text||'').length>60?'…':''}</span>
          </div>
          ${(en.stickers||[]).length?`<div style="margin-top:4px;font-size:18px">${(en.stickers||[]).join(' ')}</div>`:''}
        </div>`;
      }).join("");

  return `
    <div class="calendar-card cute-shadow">
      <input type="date" class="date-pick" value="${state.selectedDate}" onchange="selectDate(this.value)">
      <div class="selected-week">📌 Week ${String(selWeek).padStart(2,"0")} · ${selWeekYear}</div>
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;opacity:0.75">How are you feeling?</div>
      <div class="mood-row">${moodHtml}</div>
      <textarea class="diary-text" id="diary-text" placeholder="Dear diary…">${escapeHtml(e.text)}</textarea>
      ${stickersDisplay?`<div class="stickers-display">${stickersDisplay}</div>`:''}
      <div class="editor-actions">
        <button class="sticker-btn" onclick="toggleStickers()">✨ Stickers</button>
        <button class="save-btn" onclick="saveEntry()">Save entry</button>
      </div>
      ${stickerTray}
    </div>
    <div class="section-title" style="margin:24px 4px 10px">✨ Past entries</div>
    ${pastHtml}
  `;
}

// ─────────── Actions ───────────
function setMood(em) {
  const e = state.entries[state.selectedDate] || { mood:"", text:"", stickers:[] };
  e.mood = e.mood === em ? "" : em;
  state.entries[state.selectedDate] = e;
  save();
  render();
}

function addSticker(s) {
  const e = state.entries[state.selectedDate] || { mood:"", text:"", stickers:[] };
  e.stickers = [...(e.stickers||[]), s];
  state.entries[state.selectedDate] = e;
  save();
  render();
}

function removeSticker(i) {
  const e = state.entries[state.selectedDate];
  if (!e) return;
  e.stickers.splice(i, 1);
  save();
  render();
}

function toggleStickers() {
  state.showStickers = !state.showStickers;
  render();
}

function saveEntry() {
  const text = document.getElementById("diary-text").value;
  const cur = state.entries[state.selectedDate] || { mood:"", text:"", stickers:[] };
  cur.text = text;
  if (!cur.mood && !cur.text && (!cur.stickers || cur.stickers.length===0)) {
    delete state.entries[state.selectedDate];
  } else {
    state.entries[state.selectedDate] = cur;
  }
  save();
  alert("Saved 💚");
  render();
}

function deleteEntry(key) {
  if (!confirm("Delete this entry?")) return;
  delete state.entries[key];
  save();
  render();
}

function deleteEvent(id) {
  state.events[state.selectedDate] = (state.events[state.selectedDate]||[]).filter(e => e.id !== id);
  save();
  render();
}

// ─────────── Modals ───────────
function openEventModal() {
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.id = "modal-bg";
  wrap.onclick = (e) => { if (e.target === wrap) closeModal(); };
  wrap.innerHTML = `
    <div class="modal">
      <div class="handle"></div>
      <div class="modal-title">New event ✨</div>
      <input class="input" id="ev-title" placeholder="What's happening?" autofocus>
      <input class="input" id="ev-time" type="time">
      <label class="reminder-box">
        <input type="checkbox" id="ev-reminder"> 🔔 Remind me
      </label>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-save" onclick="addEvent()">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  setTimeout(()=>document.getElementById("ev-title").focus(), 100);
}

function addEvent() {
  const title = document.getElementById("ev-title").value.trim();
  const time = document.getElementById("ev-time").value;
  const reminder = document.getElementById("ev-reminder").checked;
  if (!title) { closeModal(); return; }
  const id = Date.now().toString();
  state.events[state.selectedDate] = [...(state.events[state.selectedDate]||[]), { id, title, time, reminder, notified: false }];
  save();
  if (reminder && "Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
  closeModal();
  render();
}

function openThemes() {
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.id = "modal-bg";
  wrap.onclick = (e) => { if (e.target === wrap) closeModal(); };
  const cards = Object.entries(THEMES).map(([k,th]) => `
    <button class="theme-card ${state.theme===k?'active':''}" style="border-color:${state.theme===k?'var(--primary)':'var(--border)'}" onclick="setTheme('${k}')">
      <div class="te">${th.emoji}</div>
      <div class="tn">${th.name}</div>
      <div class="td">${th.desc}</div>
    </button>
  `).join("");
  wrap.innerHTML = `<div class="modal"><div class="handle"></div><div class="modal-title">Choose a theme 🎨</div><div class="theme-grid">${cards}</div></div>`;
  document.body.appendChild(wrap);
}

function closeModal() {
  const m = document.getElementById("modal-bg");
  if (m) m.remove();
}

// ─────────── Reminders ───────────
setInterval(() => {
  const now = new Date();
  const key = todayKey();
  const todays = state.events[key] || [];
  todays.forEach(ev => {
    if (!ev.reminder || ev.notified || !ev.time) return;
    const [hh, mm] = ev.time.split(":").map(Number);
    if (now.getHours() === hh && now.getMinutes() === mm) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("📅 " + ev.title, { body: "Reminder from your diary" });
      } else {
        alert("🔔 Reminder: " + ev.title);
      }
      ev.notified = true;
      save();
    }
  });
}, 30000);

// ─────────── Init ───────────
applyTheme();
render();
</script>
</body>
</html>
